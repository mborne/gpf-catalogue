[project]
name = "gpf-catalogue"
version = "0.1.0"
description = "AI-ready catalogue of the Géoplateforme, harvested from its CSW metadata service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

# The package is installed in the virtual environment so that "uv run scripts/*.py"
# can import gpf_catalogue without any sys.path manipulation.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpf_catalogue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
