# Author: Claude (Anthropic) — this file is AI generated, see docs/init.md.
#
# Builds the overview site and publishes it on GitHub Pages.
#
# The site needs `data/catalogue.json`, and `data/` is not versioned — it is a
# rebuildable mirror, not source. So the workflow harvests the CSW service itself.
# That costs about ten minutes for 333 records at 0.2 s apart, which is why the
# mirror is cached between runs: the harvest skips records already on disk, so a
# run triggered by a code change re-downloads nothing.
#
# It also needs `web/dist`, the built front end, which is not versioned either.
# The routes are real paths, so the bundle has to know the prefix Pages serves the
# repository under — `/gpf-catalogue/` — which is why `configure-pages` runs before
# the front end is built rather than just before the upload.
name: Publish the overview site

on:
  push:
    branches: [main]
  # Weekly, so the published catalogue follows the real one. This run re-downloads
  # every record; see `refresh` below.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      refresh:
        description: Re-download every record instead of reusing the cached mirror
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time. Queued runs wait rather than race; none is cancelled,
# because a half finished harvest is worse than a slightly late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A scheduled run refreshes the whole mirror; a code change reuses it.
      HARVEST_ARGS: >-
        ${{ (github.event_name == 'schedule'
        || github.event.inputs.refresh == 'true') && '--force' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install the front end dependencies
        run: npm ci
        working-directory: web

      # Before the front end is built, because it is what says which prefix the
      # routes live under.
      - id: pages
        uses: actions/configure-pages@v6

      - name: Resolve the deployment prefix
        # `base_path` is `/gpf-catalogue` for a project site and `/` for a user
        # one; Vite wants it to end with a slash, and appending one blindly would
        # turn `/` into `//`.
        run: |
          base="${{ steps.pages.outputs.base_path }}"
          [ -z "$base" ] && base="/"
          case "$base" in */) ;; *) base="$base/" ;; esac
          echo "deploying under $base"
          echo "VITE_BASE=$base" >> "$GITHUB_ENV"

      - name: Build the front end
        run: npm run build
        working-directory: web

      # Cheap, offline, and it decides whether publishing is worth ten minutes of
      # someone else's production service. After the front end, because two of the
      # tests read the bundle it produces and skip when it is missing.
      - name: Test
        run: uv run pytest -q

      - name: Lint
        run: uvx ruff check .

      # A rolling cache: the key never hits, so every run saves a fresh mirror,
      # and `restore-keys` hands the previous one to the harvest to build on.
      - name: Restore the harvested mirror
        uses: actions/cache@v6
        with:
          path: data/csw
          key: csw-mirror-${{ github.run_id }}
          restore-keys: csw-mirror-

      - name: Harvest
        # Exit 1 is expected, not a regression: 3 records fail server side ISO
        # 19115-3 transformation and cannot be harvested at all. The step below
        # is what decides whether the run produced enough to publish.
        run: uv run scripts/harvest.py $HARVEST_ARGS || true

      - name: Parse
        # Exit 1 is expected here too: 7 records are published with no
        # identification block, so they have neither title nor abstract.
        run: uv run scripts/parse.py || true

      - name: Refuse to publish a truncated catalogue
        run: |
          uv run python - <<'PY'
          import json
          import sys
          from pathlib import Path

          catalogue = Path("data/catalogue.json")
          if not catalogue.is_file():
              sys.exit("no catalogue.json: the harvest produced nothing")

          count = json.loads(catalogue.read_text(encoding="utf-8"))["count"]
          print(f"{count} records in the pivot catalogue")

          # 326 of the 336 published records convert, measured on 2026-09-20.
          # Well below that means the harvest was cut short — a truncated site
          # would quietly misreport the catalogue, which is worse than no update.
          if count < 300:
              sys.exit(f"only {count} records, refusing to publish")
          PY

      # The coverage compares the catalogue to what three services other than the
      # CSW say they serve. Not cached: it is three requests and a twelve page
      # feed, against ten minutes for the records, and a stale inventory would
      # report layers that no longer exist as uncovered.
      - name: Harvest the service inventories
        # Exit 1 means one service was unreachable. The coverage is reported per
        # service, so two thirds of it is still worth publishing, and a run with
        # none simply publishes a site that says the coverage was not measured.
        run: uv run scripts/harvest_services.py --force || true

      - name: Build the site
        run: uv run scripts/build_site.py

      # The site carries catalogue.json, stats.json and coverage.json, so
      # publishing it also publishes the data:
      # https://<owner>.github.io/<repo>/catalogue.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
